name: junk_fusion_ui
description: "JunkFusion"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0 # 运行时需要用到的注解
  json_annotation: ^4.12.0 # 👈 新增：用于 JSON 的注解
  tabler_icons_plus: ^3.44.0 #增强版图标
  shared_preferences: ^2.5.0 #和localStorage一样，做轻量数据存储
  ffi: ^2.2.0
  file_picker: ^11.0.3
  smooth_scroll_multiplatform: ^ 1.0.8 #他妈的这个逼玩意才是唯一能够实现平滑滚动的，,虽然说不能实现键盘操作
  package_rename_plus: ^1.11.0
  provider: ^6.1.2
  window_manager: ^0.5.2
  logger: ^2.7.0
  path_provider: ^2.1.6
  tray_manager: ^0.5.3
  audio_video_progress_bar: ^2.0.3 #进度条,
  collection: ^1.19.1 #提供firstWhereOrNull
  windows_taskbar: ^1.1.2 #windows平台鼠标悬停在任务栏图标上的播放控制功能
  win32: ^5.9.0
  flutter_root_context_menu: ^0.11.0 #右键菜单
  dropdown_button2: ^3.1.0 #comboBox
  intl4x: ^1.0.1 #字符串排序
  flutter_alone: ^4.1.0 #单应用模式应用锁
  desktop_drop: ^0.8.4 #文件拖拽
  flutter_directory_tree: ^1.0.0 #树状视图
  flex_color_scheme: 8.4.0 #主题和色彩
  toastification: 3.2.2
  animated_reorderable_list: ^1.3.0

dependency_overrides:
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.8.0 # 用于生成 JSON 解析代码
  ffigen: ^23.0.0
  rename_app: ^1.6.6 #用来改变APP名称的依赖包
  flutter_launcher_icons: ^0.14.4 #用来修改应用图标
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_launcher_icons:
  image_path: "assets/image/JunkFusion.png"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/image/
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700

    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
